<script>
/* Apply the persisted or system appearance before rendering to avoid a flash. */
(function(){
  const choices=['light','dark','system'];
  let selected='system';
  try{
    const stored=localStorage.getItem('rr-info-appearance');
    if(choices.includes(stored))selected=stored;
  }catch(_){}
  const dark=selected==='dark'||(selected==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.appearance=selected;
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.documentElement.style.colorScheme=dark?'dark':'light';
})();
</script>

<style>
@font-face{font-family:Frutiger;src:url('https://tonybzzhao.github.io/rr/fonts/FrutigerNext-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Frutiger;src:url('https://tonybzzhao.github.io/rr/fonts/FrutigerNext-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:Frutiger;src:url('https://tonybzzhao.github.io/rr/fonts/FrutigerNext-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
/* RR Info palette: all UI colours are defined here rather than per component. */
:root{
 /* Operators, travelled paths, railway lines and first class. */
 --main:#0057B8;--via:#D162C0;--night:#394779;--rr:#00783C;
 --travel-main:#4D8EE9;--travel-via:#F08ADF;--travel-night:#7080B1;
 --rail:#9DC8EE;--first-class:#FAC800;--first-class-ink:#23364E;--on-accent:#FFFFFF;
 /* Text: primary neutral, strong navy, softer navy, grey and two subdued levels. */
 --ink:#1D1D1D;--ink-strong:#23364E;--ink-soft:#34495E;
 --muted:#666666;--muted-slate:#667588;--text-faint:#8795A5;
 /* Surfaces and strokes. */
 --surface:#FFFFFF;--map:#FBFBFA;--hair:#DDDDDA;
 --stroke:#C4CCD5;--stroke-strong:#AEBCCD;--stroke-soft:#E4E9EE;
 --hover:#F4F6F8;--hover-blue:#EDF3FA;--selected:#EAF1FA;--pressed:#DFEAFB;
 /* Controls and elevation. */
 --main-hover:#004A9A;--main-deep:#003E89;--accent-stroke:#8DA9CA;
 --shadow:#001F5A18;--focus-ring:#0057B815;
 /* Status colours are semantic, separate from train categories. */
 --status-on-time:#1E7E34;--status-expected:#B25000;--status-cancelled:#C4281C;
 --status-on-time-bg:#E6F4EA;--status-expected-bg:#FFF4E5;--status-cancelled-bg:#FDECEA;
 --station-blue:var(--main-deep);--head:70px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Frutiger,'Helvetica Neue',Arial,sans-serif;font-weight:400;color:var(--ink);background:var(--surface);font-size:14px}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.app{display:grid;grid-template-columns:316px minmax(340px,1fr) 362px;height:100dvh;min-height:520px;transition:grid-template-columns .18s ease}
.app.folded{grid-template-columns:88px minmax(340px,1fr) 362px}
.side,.details{min-width:0;background:var(--surface);display:flex;flex-direction:column;min-height:0}
.side{border-right:1px solid var(--hair)}
.side-header{height:var(--head);display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--hair);padding:0 15px;flex-shrink:0}
.longmark{display:block;flex:1;min-width:0}
.longmark img{height:auto;max-width:177px;width:100%;display:block}
.shortmark{display:none}
.shortmark img{width:34px;height:16px;display:block}
.fold-button{width:31px;height:32px;border:0;background:none;font-weight:500;font-size:24px;flex-shrink:0;color:var(--ink)}
.side-content{display:flex;flex:1;flex-direction:column;min-height:0}
.side-controls{padding:21px 20px 15px;border-bottom:1px solid var(--hair)}
.eyebrow{font-size:12px;color:var(--muted-slate);font-weight:500;margin-bottom:8px}
.side-controls h1{font-size:21px;font-weight:700;margin:0 0 16px;letter-spacing:-.02em;line-height:1.08}
#stationSelect{height:35px;width:100%;border:1px solid var(--stroke-strong);padding:0 9px;border-radius:0;background:var(--surface);color:var(--ink);white-space:nowrap;text-overflow:ellipsis}
.boardhead{display:grid;grid-template-columns:47px 73px 1fr 26px;gap:8px;border-bottom:1px solid var(--hair);padding:13px 16px 9px;color:var(--muted);font-size:11px;font-weight:500}
.board{overflow:auto;flex:1}
.trainrow{display:grid;grid-template-columns:47px 73px 1fr 26px;gap:8px;padding:12px 16px 13px;background:var(--surface);border:0;border-bottom:1px solid var(--stroke-soft);text-align:left;width:100%;min-width:0;align-items:start}
.trainrow:hover{background:var(--hover)}
.trainrow.selected{background:var(--selected);box-shadow:inset 3px 0 0 var(--service-color)}
.row-time{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.4}
.service{font-size:12px;font-weight:700;white-space:nowrap;color:var(--service-color);line-height:1.7}
.dest{min-width:0;word-break:normal;font-size:14px;font-weight:500;line-height:1.23}
.dest,.rowstatus{display:block}.rowstatus{font-size:11.5px;font-weight:400;color:var(--muted-slate);margin-top:5px;line-height:1.2}
.platform{text-align:right;font-size:15px;font-weight:700}
.side-foot{font-size:11px;color:var(--muted);border-top:1px solid var(--hair);padding:11px 17px;line-height:1.35;flex-shrink:0}
.empty{color:var(--muted-slate);line-height:1.5;padding:18px 20px;font-size:13px}
.folded .side-header{padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:72px;gap:1px}
.folded .longmark{display:none}
.folded .shortmark{display:block}
.folded .fold-button{height:28px}
.folded .side-content{display:none}
.folded .side-foot{display:none}
.folded .fold-placeholder{display:flex}
.fold-placeholder{display:none;align-items:center;flex-direction:column;gap:8px;margin-top:24px;color:var(--muted-slate);font-size:11px;letter-spacing:.02em}
.fold-placeholder button{border:0;background:none;width:56px;height:44px;cursor:pointer}
.fold-placeholder svg{width:25px;height:25px;fill:var(--ink)}
.map-area{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--map)}
.map-header{min-height:var(--head);border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--surface);gap:10px;flex-wrap:wrap}
.map-title{font-size:18px;font-weight:700;line-height:1.1;white-space:nowrap}
.map-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.map-tools label{font-size:12px;color:var(--muted)}
.map-tools select{border:1px solid var(--stroke-strong);height:32px;background:var(--surface);border-radius:0;max-width:142px;padding:0 6px;font-size:12px;text-overflow:ellipsis}
.map-tools>button{height:32px;padding:0 11px;background:var(--surface);border:1px solid var(--stroke-strong);border-radius:0;color:var(--ink);font-size:12px;font-weight:500}
.map-tools>button:hover{background:var(--hover)}
.map-container{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--map)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}#map text,#map tspan,#map .station-label,#map .mapnode{user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
#map.drag{cursor:grabbing}
.rail{fill:none;stroke:var(--rail);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rail.hsl{stroke-width:5.8}.rail.ml{stroke-width:2.8}
.rail-under{fill:none;stroke:var(--surface);stroke-width:10;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.route-line{fill:none;vector-effect:non-scaling-stroke;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.mapnode{cursor:pointer}
.label{font-family:Frutiger,'Helvetica Neue',Arial,sans-serif;fill:var(--ink);font-size:15.625px;letter-spacing:-.01em;font-weight:500;cursor:pointer;pointer-events:all}
.label.important{font-weight:700}
.station-label{cursor:pointer;pointer-events:all}
.station-label:focus-visible .label{text-decoration:underline}
.tooltip{position:absolute;display:none;padding:5px 8px;background:var(--ink);color:var(--surface);pointer-events:none;font-size:12px;white-space:nowrap;z-index:10;transform:translate(-50%,-115%)}
.zoom-control{position:absolute;right:16px;bottom:18px;display:grid;grid-template-columns:repeat(3,34px);border:1px solid var(--stroke);background:var(--surface)}
.zoom-control button{width:34px;height:34px;border:0;border-right:1px solid var(--hair);background:var(--surface);font-size:18px}
.zoom-control button:last-child{border:0;font-size:12px;font-weight:500}
.zoom-control button:disabled{opacity:.38;cursor:default}
.map-legend{position:absolute;bottom:18px;left:18px;display:flex;gap:18px;align-items:center;background:var(--surface);padding:10px 12px;border:1px solid var(--stroke-soft);font-size:11px;color:var(--muted)}
.key{display:flex;align-items:center;gap:7px;white-space:nowrap}
.keymark{width:23px;border-top:5.8px solid var(--rail)}.keymark.thin{border-top-width:2.8px}
.details{border-left:1px solid var(--hair)}
.details-head{height:var(--head);padding:0 20px;border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.details-head h2{font-size:18px;font-weight:700;margin:0}
.close-detail{display:none;background:none;border:0;font-size:24px;width:28px;height:32px}

.rr-section-guide{display:flex;align-items:end;gap:0;padding:0;margin-bottom:.5px}
.rr-section-leading{flex:0 0 calc(var(--rr-arrow-width) + var(--rr-arrow-gap) - var(--rr-section-offset))}

 text-align:center;font-size:12.75px;font-weight:500;line-height:1;
 padding:0 0 5px;color:var(--rr-muted);box-sizing:border-box}
.rr-section-cell::after{content:"";position:absolute;left:0;right:0;bottom:0;
 border-bottom:2px solid currentColor;pointer-events:none}
.rr-section-cell:not(:last-child)::after{right:2px}
.rr-car-line{display:flex;align-items:flex-start;gap:0;width:max-content;min-width:100%;padding-bottom:8px;border-bottom:1px solid var(--rr-border)}
/* Coach and direction-arrow artboards are contiguous: no inter-artboard margins. */

 border:0;background:transparent;color:var(--rr-ink);padding:0;cursor:pointer;display:block;isolation:isolate
}

/* The original soft-grey edge and subtle fill stay unchanged.
   Each selection rectangle wraps the actual coach paint bounds with an even
   2.25px outside clearance. The top edge sits between roof and section bar. */

.rr-car-selection-outline{
 position:absolute;width:var(--rr-outline-size);height:var(--rr-outline-size);
 top:calc((var(--rr-car-height) - var(--rr-outline-size))/2);
 left:calc((var(--rr-car-width) - var(--rr-outline-size))/2);
 display:block;fill:var(--hover);stroke:var(--accent-stroke);stroke-width:.52;

 z-index:0;opacity:0;overflow:visible
}

/* All six uploaded coach shapes share a 32x32 viewBox and 40x40 display artboard. */

 top:calc((var(--rr-car-height) - var(--rr-outline-size))/2);
 left:calc((var(--rr-car-width) - var(--rr-outline-size))/2);
 display:block;color:var(--rr-ink);pointer-events:none;z-index:1
}

// Binary heap Dijkstra. Schematic distance is for routing only, not timetable estimation.
function shortest(a,b){if(a===b)return[a];const d=new Float64Array(P.length);d.fill(Infinity);d[a]=0;const prev=new Int32Array(P.length);prev.fill(-1);const heap=[[0,a]];
 function push(item){heap.push(item);let i=heap.length-1;while(i){const j=(i-1)>>1;if(heap[j][0]<=item[0])break;heap[i]=heap[j];i=j}heap[i]=item}

 while(heap.length){const [dist,u]=pop();if(dist>d[u])continue;if(u===b)break;for(const [v,w] of adj[u]){const nd=dist+w;if(nd<d[v]){d[v]=nd;prev[v]=u;push([nd,v])}}}

 if(routeCache.has(t.id))return routeCache.get(t.id);
 const r=[],ends=[0];
 for(let i=0;i<t.route.length-1;i++){
  const a=S.get(t.route[i][0]),b=S.get(t.route[i+1][0]);
  if(a&&b){
   let seg=shortest(a.point,b.point);
   if(r.length)seg=seg.slice(1);
   r.push(...seg);
  }
  ends.push(Math.max(0,r.length-1));

}

 function mark(){const opts=[...list.querySelectorAll('.picker-option')];opts.forEach((opt,i)=>{opt.classList.toggle('active',i===active);opt.setAttribute('aria-selected',String(items[i]===select.value))});if(opts[active]){input.setAttribute('aria-activedescendant',opts[active].id);opts[active].scrollIntoView({block:'nearest'});}}
 function render(q=''){
  const term=normalize(q);items=names.filter(n=>normalize(n).includes(term));
  if(term){items.sort((a,b)=>Number(!normalize(a).startsWith(term))-Number(!normalize(b).startsWith(term))||a.localeCompare(b));}
  active=Math.max(0,items.indexOf(select.value));list.replaceChildren();
  if(!items.length){const empty=document.createElement('div');empty.className='picker-empty';empty.textContent='No matching stations';list.append(empty);return;}
  items.forEach((name,i)=>{const o=document.createElement('button');o.type='button';o.className='picker-option';o.id=id+'Opt'+i;o.setAttribute('role','option');o.textContent=name;o.addEventListener('pointerdown',e=>e.preventDefault());o.addEventListener('click',()=>choose(name));list.append(o)});mark();
 }
 function show(query=''){closeOthers();render(query);open=true;shell.classList.add('open');list.classList.add('open');input.setAttribute('aria-expanded','true');}
 input.addEventListener('focus',()=>{show('');input.select()});
 input.addEventListener('input',()=>{show(input.value);active=0;mark()});
 input.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!open)show('');else if(items.length){active=(active+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;mark()}}
  else if(e.key==='Enter'){e.preventDefault();if(!open){show('');return}if(items.length)choose(items[active]);else shut();}
  else if(e.key==='Escape'){e.preventDefault();shut();input.blur()}
  else if(e.key==='Tab')shut();
 });
 toggle.addEventListener('click',()=>{if(open){shut();input.blur()}else{input.focus();show('');input.select()}});
 select.addEventListener('change',sync);
 pickerViews.set(id,{shell,shut,sync});sync();
}
document.addEventListener('pointerdown',e=>{for(const {shell,shut} of pickerViews.values())if(!shell.contains(e.target))shut()});
function timeOrdinal(s){const m=String(s).match(/^(\d{1,2}):(\d{2})(?:\s*\+(\d+))?/);return m?(+m[1])*60+(+m[2])+(+(m[3]||0))*1440:0}
function upcoming(station){return TRAINS.map(t=>{const index=t.route.findIndex(s=>s[0]===station);if(index<0||index===t.route.length-1)return null;return{...t,hereTime:t.route[index][1],hereIndex:index}}).filter(Boolean).sort((a,b)=>stopOrdinal(a,a.hereIndex)-stopOrdinal(b,b.hereIndex)||a.id.localeCompare(b.id))}
function arriving(station){return TRAINS.map(t=>{const index=t.route.findIndex(s=>s[0]===station);if(index<=0)return null;return{...t,hereTime:t.route[index][1],hereIndex:index}}).filter(Boolean).sort((a,b)=>stopOrdinal(a,a.hereIndex)-stopOrdinal(b,b.hereIndex)||a.id.localeCompare(b.id))}
let departures=[];
function drawBoard(){
 if(viewMode==='journeys'){renderJourneyResults();return}
 const isArrival=viewMode==='arrivals';
 departures=isArrival?arriving(currentStation):upcoming(currentStation);
 board.replaceChildren();
 $('stationHeading').textContent=currentStation;
 $('stationBoardTitle').textContent=isArrival?'Arrivals':'Departures';
 $('boardRouteHeader').textContent=isArrival?'Origin':'Destination';
 if(!departures.length){board.innerHTML=`<div class="empty">No ${isArrival?'arrivals':'departures'}.</div>`;return}
 for(const t of departures){
  const row=document.createElement('button');
  row.type='button';
  row.className='trainrow'+(selectedTrain?.id===t.id?' selected':'');
  row.style.setProperty('--service-color',C[t.type]);
  row.innerHTML=`<span class="row-time">${stopTimeMarkup(t,t.hereIndex)}</span><span class="service">${t.id}</span><span><span class="dest">${isArrival?t.origin:t.dest}</span><span class="rowstatus">${statusTag(stopStatus(t,t.hereIndex))}</span></span><span class="platform">${t.platforms?.[currentStation]||t.plat||'–'}</span>`;
  row.addEventListener('click',()=>chooseTrain(t));
  board.append(row);
 }
}

 const serial=Number((t.id.match(/\d+/)||['0'])[0]);
 if(t.type==='Max')return serial%3===0?'M8':'M12';
 if(t.type==='VIA')return serial%3===0?'V10':'V8';
 if(t.type==='InterCity')return serial%4===0?'IC10P':'IC10';
 if(t.type==='Nightline')return serial%3===0?'NL9P':'NL11';

}

/* Passenger counts are not supplied, so high-frequency timetable corridors
   act as a demand proxy. A given Max, Via or InterCity service is ENTIRELY
   single-deck or ENTIRELY duplex, never a mixed composition. Facilities, stops
   and service categories are unchanged. */
const RR_SEGMENT_FREQUENCY=new Map();
function rrSegmentKey(a,b){return [a,b].sort().join('\u0000')}
for(const train of TRAINS){
 for(let i=1;i<train.route.length;i++){
  const key=rrSegmentKey(train.route[i-1][0],train.route[i][0]);
  RR_SEGMENT_FREQUENCY.set(key,(RR_SEGMENT_FREQUENCY.get(key)||0)+1);
 }
}
function rrHighPatronageProxy(train){
 if(!['Max','VIA','InterCity'].includes(train.type)||train.route.length<4)return false;
 const threshold={Max:78,VIA:70,InterCity:52}[train.type];
 let total=0;
 for(let i=1;i<train.route.length;i++)
  total+=RR_SEGMENT_FREQUENCY.get(rrSegmentKey(train.route[i-1][0],train.route[i][0]))||0;
 return total/(train.route.length-1)>=threshold;
}
const RR_DUPLEX_FORMATIONS=new Set(['M8','M12','V8','V10','IC10','IC10P']);

 // The index is retained for older callers; every coach shares one deck type.
 return RR_DUPLEX_FORMATIONS.has(form.key)&&rrHighPatronageProxy(train);
}

function rrTotalSections(n){return n>=11?6:n>=9?5:4}
/* A real train may stop at any position relative to equally long platform
   sections. Use a stable illustrative offset per service until actual stop
   position data is provided: no rerandomising when clicking a coach. */
function rrStoppingOffset(t,form){
 const seed=String(t.id)+'|'+form.key;
 let hash=2166136261;
 for(let i=0;i<seed.length;i++)hash=Math.imul(hash^seed.charCodeAt(i),16777619)>>>0;
 return 10+(((hash>>>16)^(hash&65535))%13); // stable 10-22 px offset
}
function rrCoachMetrics(form,t){
 const n=form.cars.length,coachWidth=40,gap=0;
 const hasFront=form.power!=='EMU',hasRear=form.power==='POWER';
 const totalVehicles=n+(hasFront?1:0)+(hasRear?1:0);
 const totalWidth=totalVehicles*coachWidth+(totalVehicles-1)*gap;
 const offset=rrStoppingOffset(t,form),count=rrTotalSections(n);
 const sectionWidth=Math.ceil((totalWidth+offset+8)/count);
 const sections=Array.from({length:count},(_,i)=>({
  letter:'ABCDEF'[i],width:sectionWidth,
  startX:-offset+i*sectionWidth,endX:-offset+(i+1)*sectionWidth
 }));
 const carRanges=Array.from({length:n},(_,i)=>{
  const vehicleIndex=i+(hasFront?1:0),start=vehicleIndex*(coachWidth+gap);
  return {start,end:start+coachWidth};
 });
 return {gap,coachWidth,offset,sections,sectionWidth,totalWidth,carRanges};
}
function rrSectionStopText(t,form,index){
 const metrics=rrCoachMetrics(form,t),car=metrics.carRanges[index];
 const touched=metrics.sections.filter(s=>s.startX<car.end-.01&&s.endX>car.start+.01);
 if(touched.length>1)return `Stops between sections ${touched[0].letter} and ${touched[touched.length-1].letter}`;
 return `Stops at section ${(touched[0]||metrics.sections[0]).letter}`;
}

 // First-class seated coaches show the provided first.svg icon among their facilities.

function rrDirection(t,from=null,to=null){
 // The local travel direction follows adjacent calls on the schematic.
 const route=t.route||[];
 const i=route.findIndex(x=>x[0]===currentStation);
 if(!from||!to){
  const a=i>=0?i:0;
  const b=a<route.length-1?a+1:a;
  const p=b===a?Math.max(0,a-1):a;
  from=route[p]?.[0]||t.origin;
  to=route[b]?.[0]||t.dest;
 }
 const a=S.get(from),b=S.get(to);
 if(a&&b){
  const dx=b.x-a.x,dy=b.y-a.y;
  if(Math.abs(dx)>0.1)return dx>0?'right':'left';
  if(Math.abs(dy)>0.1)return dy>=0?'right':'left';
 }

}
function rrCoachDetail(t,form,index){

function rrFrenchText(source){
 if(!source || !source.trim())return source;
 const leading=source.match(/^\s*/)[0], trailing=source.match(/\s*$/)[0];
 let s=source.slice(leading.length,source.length-trailing.length);
 if(Object.prototype.hasOwnProperty.call(rrFrenchExact,s))return leading+rrFrenchExact[s]+trailing;
 s=s
  .replace(/\bExpected \+(\d+) min\b/g,(_,n)=>'Retard +'+n+' min')
  .replace(/\b(\d+) services\b/g,(_,n)=>n+' trajets')
  .replace(/\b1 service\b/g,'1 trajet')
  .replace(/\b(\d+) changes\b/g,(_,n)=>n+' correspondances')
  .replace(/\b1 change\b/g,'1 correspondance')
  .replace(/\bChange at ([^·]+?)(?=\s*·|$)/g,(_,name)=>'Correspondance à '+name.trim())
  .replace(/\bArrive platform (\S+)/g,'Voie d’arrivée : $1')
  .replace(/\bDepart platform (\S+)/g,'Voie de départ : $1')
  .replace(/\bBack to journey\b/g,'Retour au trajet')
  .replace(/\bBack to train ([\w -]+)/g,'Retour au train $1')
  .replace(/\bBack to ([A-Z]{1,5}\s*\d+)\b/g,'Retour au train $1')
  .replace(/\bStops between sections ([A-F]) and ([A-F])\b/g,'Arrêt entre les secteurs $1 et $2')
  .replace(/\bStops at section ([A-F])\b/g,'Arrêt en secteur $1')
  .replace(/\bDay (\d+)\b/g,'Jour $1')
  .replace(/\bScheduled ([^;]+); revised (.+)/g,'Heure prévue : $1 ; heure estimée : $2')
  .replace(/\bShow departures at (.+)/g,'Afficher les départs de $1')
  .replace(/\bAppearance: (Light|Dark|System)\b/g,(_,v)=>'Apparence : '+rrFrenchExact[v])
  .replace(/\bLanguage: (English|Français)\b/g,(_,name)=>'Langue : '+name)
  .replace(/\b(\d+)h (\d{2})m\b/g,'$1 h $2')
  .replace(/\bNo (high-speed )?(direct )?services found between these stations in the current timetable\./g,
   (_,high,direct)=>'Aucun trajet'+(high?' à grande vitesse':'')+(direct?' sans correspondance':'')+' trouvé entre ces gares dans les horaires disponibles.')
  .replace(/\bRR InterCity\b/g,'RR Intercités')
  .replace(/\bRR Nightline\b/g,'RR Nocturne')
  .replace(/\bFirst Class sleeper\b/g,'Voiture-lits Première')
  .replace(/\bFirst Class\b/g,'Première classe')
  .replace(/\bPower car\b/g,'Motrice')
  .replace(/\bLocomotive\b/g,'Motrice');
 return leading+s+trailing;
}
function rrLocalizeTextNode(node,reset=false){
 if(node.parentElement?.closest('script,style,svg,option[value]'))return;
 const current=node.nodeValue;
 const previous=rrTranslatedText.get(node);
 if(!reset&&previous!==undefined&&previous===current)return;
 if(!reset||!rrEnglishText.has(node)||(previous!==undefined&&previous!==current))rrEnglishText.set(node,current);
 const original=rrEnglishText.get(node);
 const wanted=rrActiveLocale==='fr'?rrFrenchText(original):original;
 rrTranslatedText.set(node,wanted);
 if(current!==wanted)node.nodeValue=wanted;
}
function rrLocalizeAttrs(el,reset=false){
 if(el.closest('svg,script,style'))return;
 for(const attr of ['aria-label','title','placeholder']){
  if(!el.hasAttribute(attr))continue;
  const current=el.getAttribute(attr),all=rrEnglishAttrs.get(el)||new Map(),last=rrTranslatedAttrs.get(el)||new Map();
  if(!reset&&last.has(attr)&&last.get(attr)===current)continue;
  if(!reset||!all.has(attr)||(last.has(attr)&&last.get(attr)!==current))all.set(attr,current);
  rrEnglishAttrs.set(el,all);
  const wanted=rrActiveLocale==='fr'?rrFrenchText(all.get(attr)):all.get(attr);
  last.set(attr,wanted);rrTranslatedAttrs.set(el,last);
  if(current!==wanted)el.setAttribute(attr,wanted);
 }
}
function rrLocalizeSubtree(root,reset=false){
 if(!root)return;
 if(root.nodeType===3){rrLocalizeTextNode(root,reset);return}
 if(root.nodeType!==1 || root.closest('svg,script,style'))return;
 rrLocalizeAttrs(root,reset);
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);
 let node;
 while((node=walker.nextNode())){
  if(node.nodeType===3)rrLocalizeTextNode(node,reset);
  else rrLocalizeAttrs(node,reset);
 }
}

function rrApplyLocale(code){

 }

});
rrLanguageMenu.querySelectorAll('[data-language-choice]').forEach(button=>{
 button.addEventListener('click',()=>{
  if(button.disabled)return;
  rrSetLanguage(button.dataset.languageChoice,true);
  rrCloseLanguage();
  rrLanguageToggle.focus();
 });
});
document.addEventListener('pointerdown',event=>{
 if(!rrLanguageMenu.hidden&&!rrLanguagePicker.contains(event.target))rrCloseLanguage();
});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&!rrLanguageMenu.hidden){rrCloseLanguage();rrLanguageToggle.focus()}
});
window.addEventListener('storage',event=>{
 if(event.key===rrLanguageKey)rrSetLanguage(event.newValue||'en');
});
let rrInitialLanguage='en';
try{rrInitialLanguage=localStorage.getItem(rrLanguageKey)||'en'}catch(_){}
rrSetLanguage(rrInitialLanguage);


/* All six preference/swap SVG files now contain real vector outlines.
   Inline SVG symbols render across devices without any system-font probe. */
</script>
</body>
</html>
