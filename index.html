<style>
@font-face{font-family:Frutiger;src:url('./fonts/FrutigerNext-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Frutiger;src:url('./fonts/FrutigerNext-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:Frutiger;src:url('./fonts/FrutigerNext-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
:root{--main:#0057B8;--via:#D162C0;--night:#394779;--rr:#00783C;--ink:#1d1d1d;--muted:#666;--hair:#ddddda;--surface:#fff;--map:#fbfbfa;--rail:#9dc8ee;--head:70px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Frutiger,'Helvetica Neue',Arial,sans-serif;font-weight:400;color:var(--ink);background:#fff;font-size:14px}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.app{display:grid;grid-template-columns:316px minmax(340px,1fr) 362px;height:100dvh;min-height:520px;transition:grid-template-columns .18s ease}
.app.folded{grid-template-columns:74px minmax(340px,1fr) 362px}
.side,.details{min-width:0;background:#fff;display:flex;flex-direction:column;min-height:0}
.side{border-right:1px solid var(--hair)}
.side-header{height:var(--head);display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--hair);padding:0 15px;flex-shrink:0}
.longmark{display:block;flex:1;min-width:0}
.longmark img{height:26px;max-width:177px;width:100%;display:block}
.shortmark{display:none}
.shortmark img{width:34px;height:16px;display:block}
.fold-button{width:31px;height:32px;border:0;background:none;font-weight:500;font-size:24px;flex-shrink:0;color:#3e3e3e}
.side-content{display:flex;flex:1;flex-direction:column;min-height:0}
.side-controls{padding:21px 20px 15px;border-bottom:1px solid var(--hair)}
.eyebrow{font-size:12px;color:#767676;font-weight:500;margin-bottom:8px}
.side-controls h1{font-size:21px;font-weight:700;margin:0 0 16px;letter-spacing:-.02em;line-height:1.08}
#stationSelect{height:35px;width:100%;border:1px solid #b6b8b9;padding:0 9px;border-radius:0;background:#fff;color:#202020;white-space:nowrap;text-overflow:ellipsis}
.boardhead{display:grid;grid-template-columns:47px 73px 1fr 26px;gap:8px;border-bottom:1px solid var(--hair);padding:13px 16px 9px;color:#606060;font-size:11px;font-weight:500}
.board{overflow:auto;flex:1}
.trainrow{display:grid;grid-template-columns:47px 73px 1fr 26px;gap:8px;padding:12px 16px 13px;background:#fff;border:0;border-bottom:1px solid #ececea;text-align:left;width:100%;min-width:0;align-items:start}
.trainrow:hover{background:#f6f7f7}
.trainrow.selected{background:#eaf1fa;box-shadow:inset 3px 0 0 var(--service-color)}
.row-time{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.4}
.service{font-size:12px;font-weight:700;white-space:nowrap;color:var(--service-color);line-height:1.7}
.dest{min-width:0;word-break:normal;font-size:14px;font-weight:500;line-height:1.23}
.dest,.rowstatus{display:block}.rowstatus{font-size:11.5px;font-weight:400;color:#777;margin-top:5px;line-height:1.2}
.platform{text-align:right;font-size:15px;font-weight:700}
.side-foot{font-size:11px;color:#737373;border-top:1px solid var(--hair);padding:11px 17px;line-height:1.35;flex-shrink:0}
.empty{color:#777;line-height:1.5;padding:18px 20px;font-size:13px}
.folded .side-header{padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:72px;gap:1px}
.folded .longmark{display:none}
.folded .shortmark{display:block}
.folded .fold-button{height:28px}
.folded .side-content{display:none}
.folded .side-foot{display:none}
.folded .fold-placeholder{display:flex}
.fold-placeholder{display:none;align-items:center;flex-direction:column;gap:8px;margin-top:24px;color:#777;font-size:11px;letter-spacing:.02em}
.fold-placeholder button{border:0;background:none;width:56px;height:44px;cursor:pointer}
.fold-placeholder svg{width:25px;height:25px;fill:#444}
.map-area{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--map)}
.map-header{min-height:var(--head);border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#fff;gap:10px;flex-wrap:wrap}
.map-title{font-size:18px;font-weight:700;line-height:1.1;white-space:nowrap}
.map-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.map-tools label{font-size:12px;color:#555}
.map-tools select{border:1px solid #bebebe;height:32px;background:#fff;border-radius:0;max-width:142px;padding:0 6px;font-size:12px;text-overflow:ellipsis}
.map-tools button{height:32px;padding:0 11px;background:#fff;border:1px solid #bdbdbd;border-radius:0;color:#222;font-size:12px;font-weight:500}
.map-tools button:hover{background:#f5f5f5}
.map-container{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--map)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}#map text,#map tspan,#map .station-label,#map .mapnode{user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
#map.drag{cursor:grabbing}
.rail{fill:none;stroke:var(--rail);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rail.hsl{stroke-width:5.8}.rail.ml{stroke-width:2.8}
.rail-under{fill:none;stroke:#fff;stroke-width:10;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.route-line{fill:none;vector-effect:non-scaling-stroke;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.mapnode{cursor:pointer}
.label{font-family:Frutiger,'Helvetica Neue',Arial,sans-serif;fill:#242424;font-size:12.5px;letter-spacing:-.01em;font-weight:500;cursor:pointer;pointer-events:all}
.label.important{font-weight:700}
.station-label{cursor:pointer;pointer-events:all}
.station-label:focus-visible .label{text-decoration:underline}
.tooltip{position:absolute;display:none;padding:5px 8px;background:#222;color:#fff;pointer-events:none;font-size:12px;white-space:nowrap;z-index:10;transform:translate(-50%,-115%)}
.zoom-control{position:absolute;right:16px;bottom:18px;display:grid;grid-template-columns:repeat(3,34px);border:1px solid #d0d0d0;background:#fff}
.zoom-control button{width:34px;height:34px;border:0;border-right:1px solid #ddd;background:#fff;font-size:18px}
.zoom-control button:last-child{border:0;font-size:12px;font-weight:500}
.zoom-control button:disabled{opacity:.38;cursor:default}
.map-legend{position:absolute;bottom:18px;left:18px;display:flex;gap:18px;align-items:center;background:#fff;padding:10px 12px;border:1px solid #e8e8e5;font-size:11px;color:#555}
.key{display:flex;align-items:center;gap:7px;white-space:nowrap}
.keymark{width:23px;border-top:5.8px solid var(--rail)}.keymark.thin{border-top-width:2.8px}
.details{border-left:1px solid var(--hair)}
.details-head{height:var(--head);padding:0 20px;border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.details-head h2{font-size:18px;font-weight:700;margin:0}
.close-detail{display:none;background:none;border:0;font-size:24px;width:28px;height:32px}
.details-body{overflow:auto;min-height:0;padding:21px 22px 30px}
.service-title{display:flex;gap:10px;align-items:center}
.service-square{display:inline-block;width:8px;height:34px;background:var(--service-color);flex-shrink:0}
.train-number{font-size:26px;line-height:1.05;font-weight:700;color:#202020}
.service-dest{font-size:17px;font-weight:500;line-height:1.2;margin:13px 0 18px}
.info-grid{display:grid;grid-template-columns:89px 1fr;row-gap:8px;column-gap:10px;font-size:13px;padding-bottom:20px;border-bottom:1px solid var(--hair)}
.keylabel{color:#6c6c6c}
.infoval{font-weight:500}
.facilities-heading{font-size:13px;font-weight:700;margin:23px 0 12px}
.facilities{display:flex;gap:13px;flex-wrap:wrap;margin-bottom:25px}
.facility{display:flex;flex-direction:column;align-items:center;gap:6px;width:49px;text-align:center}
.facility svg{height:29px;width:29px;color:#242424;fill:currentColor;display:block}
.facility span{font-size:10px;color:#535353;line-height:1.15}
.stops-heading{font-size:13px;font-weight:700;margin:24px 0 14px}
.stop-list{display:grid;position:relative;gap:0;--route:#0057B8}
.stop-list::before{content:"";position:absolute;left:7px;top:10px;bottom:15px;width:3px;background:var(--route)}
.stop{display:grid;grid-template-columns:18px 61px 1fr;column-gap:9px;align-items:start;min-height:45px}
.stop-icon{width:14px;height:14px;border:3px solid var(--route);border-radius:50%;background:#fff;z-index:1;position:relative;margin-top:2px}
.stop:first-child .stop-icon,.stop:last-child .stop-icon{background:var(--route)}
.stop.current .stop-icon{box-shadow:0 0 0 4px #e2e2e2}
.stop-time{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;padding-top:2px}
.stop-name{font-size:13px;line-height:1.28;font-weight:500;padding:0 0 16px}
.details-note{font-size:11px;color:#666;padding-top:16px;line-height:1.5;border-top:1px solid var(--hair)}
.map-notice{position:absolute;top:12px;left:16px;background:#fff;border:1px solid #ddd;padding:7px 11px;font-size:12px;color:#555;display:none}
@media(max-width:1260px){.app{grid-template-columns:290px minmax(0,1fr)}.app.folded{grid-template-columns:74px minmax(0,1fr)}.details{position:fixed;z-index:60;right:0;top:0;bottom:0;width:min(370px,100vw);box-shadow:-8px 0 32px #00000015;transform:translateX(102%);transition:transform .2s ease}.app.detail-open .details{transform:translateX(0)}.close-detail{display:block}}
@media(max-width:750px){:root{--head:62px}.app{display:flex;flex-direction:column;min-height:100dvh;height:auto}.side{min-height:0;flex:none;border-right:0;border-bottom:1px solid var(--hair)}.side-header{height:62px}.side-content{max-height:280px}.side-controls{padding:12px 16px}.side-controls h1{font-size:18px;margin:0 0 8px}.board{max-height:200px}.map-area{min-height:630px;height:calc(100dvh - 210px)}.map-header{padding:12px 14px}.map-tools{width:100%}.map-tools select{max-width:120px}.map-container{min-height:500px}.folded .side-header{height:62px;flex-direction:row;justify-content:space-between;padding:0 14px}.folded .fold-placeholder{display:none}.map-legend{bottom:12px;left:10px;font-size:10px;gap:8px;padding:8px}.zoom-control{right:10px;bottom:58px}}

/* Station facilities: compact, typographic, no extra cards. */
.station-fac-link{margin-top:11px;padding:0;background:none;border:0;color:var(--main);display:flex;justify-content:space-between;align-items:center;width:100%;font-size:12px;font-weight:500;cursor:pointer;text-align:left}
.station-fac-link span{font-size:19px;line-height:1}
.details-actions{display:flex;align-items:center;gap:9px}
.station-info-button{border:1px solid #d2d3d2;background:#fff;border-radius:0;height:29px;padding:0 9px;font-size:12px;font-weight:500;color:#333}
.station-info-button:hover,.station-fac-link:hover{color:var(--main)}
.station-intro{font-size:13px;color:#666;margin:12px 0 17px}
.station-picto-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 6px;margin:20px 0 25px}
.station-picto-grid .facility{width:auto}
.station-picto-grid .facility svg{width:29px;height:29px}
.station-note{font-size:11px;color:#777;border-top:1px solid var(--hair);padding-top:14px;line-height:1.4}
/* Calling-point line and symbols share one exact centre axis. */
.stop-list{display:flex;flex-direction:column;position:relative}
.stop-list::before{display:none}
.stop{display:grid;grid-template-columns:22px 67px minmax(0,1fr);column-gap:10px;align-items:stretch;min-height:48px;padding:0}
.stop-marker{position:relative;min-height:48px;display:flex;justify-content:center;align-items:center}
.stop-marker::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:3px;transform:translateX(-50%);background:var(--route)}
.stop:first-child .stop-marker::before{top:50%}
.stop:last-child .stop-marker::before{bottom:50%}
.stop-icon{height:14px;width:14px;border:3px solid var(--route);border-radius:50%;background:#fff;position:relative;z-index:1;margin:0;flex:none}
.stop:first-child .stop-icon,.stop:last-child .stop-icon{background:var(--route)}
.stop.current .stop-icon{box-shadow:0 0 0 3px #e2e2e2}
.stop-time,.stop-name{padding:12px 0;align-self:center;min-width:0;margin:0}
.stop-time{font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums;font-weight:500}
.stop-name{font-size:13px;line-height:1.35;font-weight:500;overflow-wrap:normal}
/* Map labels remain unboxed and scale-independent. */
.label{font-weight:500}

/* UK railway-style controls: readable, restrained, keyboard accessible. */
:root{--status-expected:#FAC800;--status-on-time:#00F078;--status-cancelled:#F00000;--station-blue:#001F5A}
button:focus-visible,input:focus-visible{outline:2px solid var(--main);outline-offset:2px}
button{transition:background-color .12s ease,border-color .12s ease}
.map-header{position:relative;z-index:25;overflow:visible}
.map-tools{gap:9px}
.map-tools>button,.station-info-button,.zoom-control button{border:1px solid #c4ccd5;background:#fff;border-radius:4px;color:#23364e;font-size:12px;font-weight:500;min-height:34px}
.map-tools>button{padding:0 13px}
.map-tools>button:hover,.station-info-button:hover,.zoom-control button:hover{background:#edf3fb;border-color:#8da9ca;color:#003e89}
.map-tools>button:active,.station-info-button:active,.zoom-control button:active{background:#dfeafb}
.map-tools #trace{background:#0057B8;border-color:#0057B8;color:#fff}
.map-tools #trace:hover{background:#004a9a}
.zoom-control{border-radius:5px;overflow:hidden;border-color:#c4ccd5;box-shadow:0 1px 5px #001f5a12}
.zoom-control button{border-radius:0;border:0;border-right:1px solid #e3e7eb;min-height:34px}
.zoom-control button:last-child{border-right:0}
.station-info-button{height:34px;padding:0 11px}
.route-focus{white-space:nowrap}
.search-picker{position:relative;min-width:135px;width:165px;flex:none;z-index:3}
.search-picker-main{width:100%;max-width:none}
.native-select{display:none!important}
.picker-control{height:36px;display:flex;align-items:stretch;border:1px solid #b8c3d0;background:#fff;border-radius:4px;transition:border-color .12s,box-shadow .12s}
.search-picker.open .picker-control,.picker-control:focus-within{border-color:var(--main);box-shadow:0 0 0 2px #0057b815}
.picker-input{width:100%;min-width:0;border:0!important;outline:0!important;box-shadow:none!important;background:transparent;padding:0 6px 0 11px;font-size:12px;color:#162c4b;text-overflow:ellipsis}
.search-picker-main .picker-input{font-size:13px}
.picker-toggle{width:32px;flex:none;display:flex;align-items:center;justify-content:center;border:0!important;border-left:1px solid #e6e9ed!important;border-radius:0 3px 3px 0;background:#fff;color:#3b506a;padding:0}
.picker-toggle:hover{background:#edf3fb}
.picker-toggle svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;transition:transform .12s}
.search-picker.open .picker-toggle svg{transform:rotate(180deg)}
.picker-list{position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:246px;overflow-y:auto;overscroll-behavior:contain;background:#fff;border:1px solid #aebccd;border-radius:4px;box-shadow:0 8px 20px #001f5a1b;display:none;padding:4px 0;z-index:100}
.picker-list.open{display:block}
.picker-option{display:block;width:100%;text-align:left;padding:9px 11px;border:0;background:#fff;color:#1e2a3b;font-size:12px;line-height:1.3;cursor:pointer;border-left:3px solid transparent}
.picker-option:hover,.picker-option.active{background:#eaf2fc;color:#003d86}
.picker-option[aria-selected="true"]{font-weight:700;border-left-color:var(--main)}
.picker-empty{font-size:12px;color:#687381;padding:12px}
.board,.details-body,.picker-list{scrollbar-width:thin;scrollbar-color:#aebdcc #f4f6f8}
.board::-webkit-scrollbar,.details-body::-webkit-scrollbar,.picker-list::-webkit-scrollbar{width:8px}
.board::-webkit-scrollbar-thumb,.details-body::-webkit-scrollbar-thumb,.picker-list::-webkit-scrollbar-thumb{background:#aebdcc;border:2px solid #f4f6f8;border-radius:8px}
.board::-webkit-scrollbar-track,.details-body::-webkit-scrollbar-track,.picker-list::-webkit-scrollbar-track{background:#f4f6f8}
.status-tag{display:inline-block;padding:3px 7px;border-radius:3px;line-height:1.22;white-space:nowrap;font-size:11px;font-weight:700;color:#1b242b;background:#e8edf2}
.status-on-time{background:var(--status-on-time);color:#002a1d}
.status-expected{background:var(--status-expected);color:#29210a}
.status-cancelled{background:var(--status-cancelled);color:#fff}
.status-neutral{background:#ecf0f4;color:#33465d}
.rowstatus{line-height:1.3;margin-top:6px}
.station-name-band{display:block;width:fit-content;max-width:100%;background:var(--station-blue);color:#fff;padding:11px 15px;font-weight:700;font-size:21px;line-height:1.22;overflow-wrap:anywhere}
.station-picto-grid{margin-top:24px}

/* v17 — restrained British departure-board typography */
.status-tag{display:inline;font-size:11.5px;font-weight:700;line-height:1.35;letter-spacing:.005em;padding:0;background:none!important;border:0!important;border-radius:0!important;white-space:nowrap}
.status-on-time{color:var(--status-on-time)!important}
.status-expected{color:var(--status-expected)!important}
.status-cancelled{color:var(--status-cancelled)!important}
.status-neutral{color:#40546b!important}
.rowstatus{margin-top:6px}
.service-title{gap:0}
.service-square{display:none}
.train-number{display:inline-block;width:fit-content;max-width:100%;font-size:23px;line-height:1.15;letter-spacing:.005em;font-weight:700;color:#fff!important;background:var(--service-color);padding:9px 13px 8px;border-radius:2px}

}

/* v31 — overnight delayed times: each time and its day marker form one unit.
   The revised time is primary; the struck-through scheduled time sits above it. */
.time-value{display:inline-flex;align-items:flex-start;gap:0;white-space:nowrap;max-width:none;flex-wrap:nowrap;font-variant-numeric:tabular-nums;line-height:inherit}
.time-value .time-primary{display:inline-block;flex:none;white-space:nowrap;line-height:inherit}
.time-value .day-offset{display:inline-block;flex:none;position:static;top:auto;vertical-align:top;margin:2px 0 0 3px;line-height:1;font-size:.53em;font-weight:500;letter-spacing:0;color:#8190a0;white-space:nowrap}
.time-delayed{display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;min-width:0;max-width:100%;vertical-align:top}
.time-delayed .scheduled-time{display:inline-flex;align-items:flex-start;flex:none;white-space:nowrap;font-size:.66em;color:#8391a0;font-weight:500;line-height:1.1;text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:#9ca9b7}
.time-delayed .retime-box{display:inline-flex;align-items:flex-start;justify-content:flex-start;flex:none;max-width:none;min-width:0;white-space:nowrap;flex-wrap:nowrap;padding:3px 5px;border:0;border-radius:2px;background:#edf3fa;color:#1d426d;font-size:inherit;font-weight:700;line-height:1.1}
.time-delayed .retime-box .day-offset{color:#7e8fa1}
/* The train badge must never break, and revised times must not compete for its row. */
.train-hero-top{align-items:flex-start;min-width:0;gap:10px}
.train-hero .service-title{flex:0 1 auto;min-width:0}
.train-hero .train-number{white-space:nowrap;word-break:normal;max-width:none;line-height:1.12}
.train-hero .train-departure{flex:0 0 auto;min-width:0;max-width:56%;text-align:right}
.train-hero .depart-time{line-height:1.12}
.train-hero .depart-time .time-delayed{display:flex;flex-direction:column;align-items:flex-end;gap:5px;margin-left:auto;min-width:0}
.train-hero .depart-time .scheduled-time{font-size:14px;line-height:1.12}
.train-hero .depart-time .retime-box{font-size:26px;line-height:1.12;padding:4px 6px}
.train-hero .depart-time .time-value .day-offset{font-size:11px;line-height:1;margin:2px 0 0 3px}
.train-hero .depart-time .scheduled-time .day-offset{font-size:9px;margin-top:1px}
/* Journey summaries use the same two-line hierarchy within each column. */
.journey-summary-time strong{min-width:0}
.journey-summary-time strong .time-delayed{display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-width:100%}
.journey-summary-time .journey-arrival strong .time-delayed{align-items:flex-end}
.journey-summary-time strong .scheduled-time{font-size:13px;line-height:1.15}
.journey-summary-time strong .time-delayed .retime-box{font-size:21px;line-height:1.1;padding:4px 5px}
.journey-summary-time strong .time-value .day-offset{position:static;top:auto;font-size:10px;margin-top:1px;margin-left:2px}
.journey-summary-time strong .scheduled-time .day-offset{font-size:8px;margin-top:1px}
/* Journey search: no broken +1, and the revised time is clearly legible. */
.journey-clock .time-delayed{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.journey-clock .scheduled-time{font-size:12px;line-height:1.15}
.journey-clock .time-delayed .retime-box{font-size:16px;line-height:1.13;padding:3px 4px}
.journey-clock .time-value .day-offset{position:static;top:auto;font-size:9px;margin:1px 0 0 2px}
/* Narrow departure-board time column; use small consistent day-offsets. */
.row-time .time-delayed{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.row-time .scheduled-time{font-size:11px;line-height:1.15}
.row-time .time-delayed .retime-box{font-size:11.5px;line-height:1.15;padding:2px 1px}
.row-time .time-value .day-offset{font-size:8px;margin:1px 0 0 2px}
.row-time .scheduled-time .day-offset{font-size:7px}
/* The calling-at timeline retains its original white background and railway dots. */
.stop-time .time-value .day-offset{font-size:9px;margin:1px 0 0 2px}
.stop-list.has-disruptions .stop-time .time-delayed{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.stop-list.has-disruptions .stop-time .scheduled-time{font-size:11.5px;line-height:1.1}
.stop-list.has-disruptions .stop-time .retime-box{font-size:13px;line-height:1.15;padding:2px 4px;white-space:nowrap}
.stop-list.has-disruptions .stop-time .retime-box .day-offset{font-size:8px;margin-top:1px}

 .train-hero .train-number{font-size:18px;padding:8px 10px}
 .train-hero .depart-time .retime-box{font-size:23px;padding:4px 5px}
 .train-hero .depart-time .scheduled-time{font-size:13px}
 .journey-summary-time strong .time-delayed .retime-box{font-size:18px;padding:3px 4px}
}

}

 .journey-summary-time strong .time-delayed .retime-box{font-size:18px}
}

    const legs=middleByOrigin.get(station)||[];
    for(let k=i+1;k<t.route.length;k++){
     const arr=stopOrdinal(t,k);
     if(arr>dep&&arr-dep<1100)legs.push({train:t,from:station,to:t.route[k][0],fromIdx:i,toIdx:k,dep,arr});
    }
    middleByOrigin.set(station,legs);
   }
  }
  const bestByInitial=new Map();
  for(const one of departures){
   const mids=middleByOrigin.get(one.to)||[];
   for(const two of mids){
    if(one.train.id===two.train.id||two.to===from)continue;
    const wait1=two.dep-one.arr;
    if(wait1<12||wait1>145)continue;
    const last=onwardByOrigin.get(two.to)||[];
    for(const three of last){
     if(three.train.id===one.train.id||three.train.id===two.train.id)continue;
     const wait2=three.dep-two.arr;
     if(wait2<12||wait2>145||three.arr-one.dep>1340)continue;
     const result={key:one.train.id+'|'+two.train.id+'|'+three.train.id,legs:[one,two,three],dep:one.dep,arr:three.arr,change:2};
     const previous=bestByInitial.get(one.train.id);
     if(!previous||result.arr<previous.arr)bestByInitial.set(one.train.id,result);
    }
   }
  }
  merged=[...bestByInitial.values()];
 }
 // Remove implausibly slow detours when much quicker journeys exist.
 if(merged.length){
  const bestDuration=Math.min(...merged.map(j=>j.arr-j.dep));
  const maxDuration=Math.min(1280,Math.max(bestDuration*1.45,bestDuration+80));
  merged=merged.filter(j=>j.arr-j.dep<=maxDuration);
 }
 merged.sort((a,b)=>a.dep-b.dep||a.change-b.change||a.arr-b.arr||a.key.localeCompare(b.key));
 return merged.slice(0,JOURNEY_MAX_RESULTS);
}
function updateBoardTabs(){
 const journey=viewMode==='journeys';app.classList.toggle('journey-mode',journey);
 $('journeyPanel').hidden=!journey;$('stationPanel').hidden=journey;
 $('departuresTab').classList.toggle('active',!journey);$('journeysTab').classList.toggle('active',journey);
 $('departuresTab').setAttribute('aria-selected',String(!journey));$('journeysTab').setAttribute('aria-selected',String(journey));
}
function setViewMode(mode){viewMode=mode;updateBoardTabs();if(mode==='journeys')renderJourneyResults();else drawBoard()}
function renderJourneyResults(){
 const from=$('from').value,to=$('to').value;
 $('journeyFromName').textContent=from;$('journeyToName').textContent=to;
 const onlyDirect=$('directOnly').checked;
 const list=journeyResults.filter(j=>!onlyDirect||j.change===0);
 $('journeyCount').textContent=list.length+' '+(list.length===1?'service':'services');
 board.replaceChildren();
 if(from===to){board.innerHTML='<div class="empty">Choose two different stations.</div>';return}
 if(!list.length){board.innerHTML='<div class="empty">No services found between these stations in the current timetable.</div>';return}
 for(const j of list.slice(0,journeyShown)){
  const el=document.createElement('button');el.type='button';el.className='journey-row'+(selectedJourney?.key===j.key?' selected':'');
  el.style.setProperty('--journey-color',C[j.legs[0].train.type]);
  const badges=j.legs.map(l=>`<span class="service" style="--service-color:${C[l.train.type]}">${l.train.id}</span>`).join('');
  const depMarkup=stopTimeMarkup(j.legs[0].train,j.legs[0].fromIdx),arrLast=j.legs[j.legs.length-1],arrMarkup=stopTimeMarkup(arrLast.train,arrLast.toIdx);
  el.innerHTML=`<div class="journey-times"><span class="journey-clock">${depMarkup}</span><span class="journey-line"></span><span class="journey-clock">${arrMarkup}</span></div><div class="journey-row-meta">${badges}<span class="duration">${fmtDuration(j.arr-j.dep)}</span><span class="change">${j.change?`${j.change} ${j.change===1?'change':'changes'}`:'Direct'}</span></div>${j.change?`<div class="journey-via">${j.legs.slice(0,-1).map((l,i)=>`Change at ${l.to} · ${j.legs[i+1].dep-l.arr} min`).join(' · ')}</div>`:''}`;
  el.addEventListener('click',()=>chooseJourney(j));board.append(el);
 }
 if(journeyShown<list.length){const more=document.createElement('button');more.type='button';more.className='journey-more';more.textContent='Show more trains';more.addEventListener('click',()=>{journeyShown+=12;renderJourneyResults()});board.append(more)}
}
function searchJourneys(autoSelect=true){
 const from=$('from').value,to=$('to').value;
 journeyResults=findJourneys(from,to);journeyShown=12;selectedJourney=null;
 viewMode='journeys';updateBoardTabs();renderJourneyResults();board.scrollTop=0;
 if(autoSelect&&journeyResults.length){const j=journeyResults.find(j=>!$('directOnly').checked||j.change===0);if(j)chooseJourney(j)}
 else{selectedTrain=null;selectedPath=[];selectedLegPaths=[];selectedNames=[from,to];routeWorld.replaceChildren();drawMap();$('detailsTitle').textContent='Journey details';detail.innerHTML='<div class="empty">Select a train to view its journey.</div>';$('focusRoute').hidden=true;app.classList.remove('detail-open');requestAnimationFrame(resize)}
}
function getSegmentPath(t,a,b){
 const start=t.route.findIndex(p=>p[0]===a),end=t.route.findIndex(p=>p[0]===b);
 if(start<0||end<=start)return[];
 const pieces=[];
 for(let i=start;i<end;i++){
  const s=S.get(t.route[i][0]),d=S.get(t.route[i+1][0]);if(!s||!d)continue;
  const seg=shortest(s.point,d.point);pieces.push(...(pieces.length?seg.slice(1):seg));
 }
 return pieces;
}
function chooseJourney(j){
 selectedJourney=j;selectedTrain=null;manualTrace=false;
 selectedLegPaths=j.legs.map(l=>({path:getSegmentPath(l.train,l.from,l.to),color:C[l.train.type]}));
 selectedPath=selectedLegPaths.flatMap((p,i)=>i?p.path.slice(1):p.path);
 selectedNames=[...new Set(j.legs.flatMap(l=>l.train.route.slice(l.fromIdx,l.toIdx+1).map(s=>s[0])))];
 routeColor=C[j.legs[0].train.type];
 fillJourneyDetails(j);renderJourneyResults();drawRoute();drawMap();
 app.classList.add('detail-open');$('showTrainDetails').hidden=true;
 requestAnimationFrame(()=>{resize();focusRoute()});
}
function fillJourneyDetails(j){
 $('detailsTitle').textContent='Journey details';$('focusRoute').hidden=false;
 const from=j.legs[0].from,to=j.legs[j.legs.length-1].to;
 let legs='';
 j.legs.forEach((l,index)=>{
  const t=l.train,c=C[t.type],stations=t.route.slice(l.fromIdx,l.toIdx+1);
  const rows=stations.map(([name,time],i)=>`<div class="stop${name===from?' current':''}"><div class="stop-marker"><span class="stop-icon"></span></div><div class="stop-time">${stopTimeMarkup(t,l.fromIdx+i)}</div><button type="button" class="stop-name stop-station" data-leg="${index}" data-name="${encodeURIComponent(name)}" title="View station">${name}</button></div>`).join('');
  legs+=`<section class="journey-leg"><h3 class="journey-leg-heading"><span class="service" style="--service-color:${c}">${t.id}</span><span>${t.type}</span>${statusTag(stopStatus(t,l.fromIdx))}</h3><div class="stops-heading">Calling at</div><div class="stop-list${delayMinutes(t.status)?' has-disruptions':''}" style="--route:${c}">${rows}</div></section>`;
  if(index<j.legs.length-1)legs+=`<div class="journey-transfer"><strong>Change at ${l.to}</strong> · ${j.legs[index+1].dep-l.arr} min</div>`;
 });
 const uniqueFacilityNames=[...new Set(j.legs.flatMap(l=>l.train.fac.map(facilityLabel)))];
 if(uniqueFacilityNames.includes('Accessible')&&uniqueFacilityNames.includes('Toilet'))uniqueFacilityNames.push('Accessible Toilet');
 const depFirst=j.legs[0],arrLast=j.legs[j.legs.length-1];
 detail.innerHTML=`<div class="journey-hero"><div class="journey-summary-time"><div><strong>${stopTimeMarkup(depFirst.train,depFirst.fromIdx)}</strong><small>Departs</small><span class="station">${from}</span></div><span class="arrow" aria-hidden="true">→</span><div class="journey-arrival"><strong>${stopTimeMarkup(arrLast.train,arrLast.toIdx)}</strong><small>Arrives</small><span class="station">${to}</span></div></div><div class="journey-summary-sub">${fmtDuration(j.arr-j.dep)} · ${j.change?`${j.change} ${j.change===1?'change':'changes'}`:'Direct'}</div></div>${legs}<div class="facilities-heading">Facilities</div><div class="facilities">${uniqueFacilityNames.map(pictoItem).join('')}</div>`;
 detail.querySelectorAll('.stop-station').forEach(btn=>btn.addEventListener('click',()=>{
  const name=decodeURIComponent(btn.dataset.name),returned=j;
  setCurrentStation(name);fillStationInfo(name,null,returned);
 }));
}
$('departuresTab').addEventListener('click',()=>{selectedJourney=null;selectedLegPaths=[];setViewMode('departures');setCurrentStation(currentStation)});
$('journeysTab').addEventListener('click',()=>searchJourneys());
$('directOnly').addEventListener('change',()=>{journeyShown=12;renderJourneyResults();if(selectedJourney&&$('directOnly').checked&&selectedJourney.change) {
 const first=journeyResults.find(j=>j.change===0);if(first)chooseJourney(first);
 }});
$('from').addEventListener('change',()=>searchJourneys());
$('to').addEventListener('change',()=>searchJourneys());

$('trace').onclick=()=>searchJourneys();$('clear').onclick=()=>{viewMode='departures';updateBoardTabs();selectedJourney=null;selectedLegPaths=[];clear()};
stationSelect.addEventListener('change',e=>setCurrentStation(e.target.value));
$('collapse').onclick=()=>{app.classList.toggle('folded');const is=app.classList.contains('folded');$('collapse').textContent=is?'›':'‹';$('collapse').setAttribute('aria-label',is?'Expand departures':'Collapse departures');setTimeout(resize,200)};
$('reopen').onclick=()=>$('collapse').click();
$('closeDetail').onclick=()=>{app.classList.remove('detail-open');$('showTrainDetails').hidden=!selectedTrain;requestAnimationFrame(resize)};
const ro=new ResizeObserver(()=>resize());ro.observe(container);
pathsByType();stationList();['stationSelect','from','to'].forEach(setupSearchPicker);updateBoardTabs();resize();setCurrentStation(currentStation);
// Recompute map-label collision positions once the hosted fonts are available.
if (document.fonts && document.fonts.load) {
  Promise.all([
    document.fonts.load('400 14px Frutiger'),
    document.fonts.load('500 13px Frutiger'),
    document.fonts.load('700 13px Frutiger')
  ]).then(()=>{if(W&&H)updateWorld()}).catch(()=>{});
}
